<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E55A2B" />
    </linearGradient>
    <linearGradient id="grad2" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad2)" stroke="#404040" stroke-width="8"/>
  
  <!-- Sound Waves -->
  <path d="M120 256C120 180.88 180.88 120 256 120" stroke="url(#grad1)" stroke-width="24" stroke-linecap="round" opacity="0.3"/>
  <path d="M90 256C90 164.33 164.33 90 256 90" stroke="url(#grad1)" stroke-width="24" stroke-linecap="round" opacity="0.15"/>
  
  <!-- Microphone Body -->
  <rect x="206" y="160" width="100" height="160" rx="50" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Microphone Stand/Base -->
  <path d="M256 340V400" stroke="#888" stroke-width="20" stroke-linecap="round"/>
  <path d="M180 400H332" stroke="#888" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Microphone Cup -->
  <path d="M156 240C156 295.23 200.77 340 256 340C311.23 340 356 295.23 356 240" stroke="#888" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Mic Grid Details -->
  <path d="M230 190H282" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 220H282" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 250H282" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 280H282" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
</svg>